<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío 9 – Página interactiva</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
        }
        button:hover {
            background-color: #45a049;
        }
        #mensaje {
            font-size: 20px;
            margin: 20px 0;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        #infoExtra {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f8ff;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Desafío 9 – Página interactiva</h1>

    <p id="mensaje">¡Bienvenido a mi página interactiva! Usa los botones para cambiar las cosas.</p>

    <div>
        <button onclick="cambiarTexto()">Cambiar texto</button>
        <button onclick="cambiarColor()">Cambiar color</button>
        <button onclick="cambiarTamano()">Cambiar tamaño</button>
        <button onclick="alternarInfo()">Mostrar/Ocultar info</button>
    </div>

    <div id="infoExtra">
        <p>¡Información secreta revelada! 🎉</p>
        <p>Esta página fue creada para practicar la manipulación de elementos HTML con JavaScript.</p>
    </div>

    <script>
        // Función para cambiar el texto del párrafo
        function cambiarTexto() {
            const mensaje = document.getElementById('mensaje');
            mensaje.textContent = '¡El texto ha sido cambiado exitosamente!';
        }

        // Función para cambiar el color de fondo del párrafo
        function cambiarColor() {
            const mensaje = document.getElementById('mensaje');
            mensaje.style.backgroundColor = '#ffeb3b';
            mensaje.style.borderColor = '#ff9800';
        }

        // Función para cambiar el tamaño del texto
        function cambiarTamano() {
            const mensaje = document.getElementById('mensaje');
            mensaje.style.fontSize = '28px';
        }

        // Función para mostrar u ocultar información extra
        function alternarInfo() {
            const infoExtra = document.getElementById('infoExtra');
            if (infoExtra.style.display === 'none') {
                infoExtra.style.display = 'block';
            } else {
                infoExtra.style.display = 'none';
            }
        }
    </script>
</body>
</html>
